name: Study Atlas web cross-platform smoke

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'web/assets/**'
      - '.github/tests/web-compat.mjs'
      - '.github/workflows/website-os-smoke.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/tests/web-compat.mjs
